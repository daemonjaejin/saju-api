# 파일명: .github/workflows/deploy.yml

name: Spring Boot Deploy to EC2

# master 브랜치에 push 될 때만 실행
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1단계: 소스코드 체크아웃
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2단계: Java 21 설치
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3단계: Maven 빌드 (테스트 스킵)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4단계: EC2에 jar 파일 전송 후 서비스 재시작
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 서비스 중지
            sudo systemctl stop saju-api || true
            
            # 배포 디렉토리 생성
            mkdir -p /home/ubuntu/app
            
      # 5단계: jar 파일 EC2로 복사
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 1

      # 6단계: EC2에서 서비스 재시작
      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # jar 파일명 통일
            mv /home/ubuntu/app/*.jar /home/ubuntu/app/saju-api.jar
            
            # 서비스 시작
            sudo systemctl start saju-api
            sudo systemctl status saju-api
